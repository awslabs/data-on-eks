# Bootstraps realm POLARIS and the root principal, because the chart does not do it.
# The root secret comes from the polaris-credentials Secret through $(VAR) expansion. It is not in a manifest.
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: ${namespace}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: polaris-bootstrap
    spec:
      restartPolicy: Never
      nodeSelector:
        NodeGroupType: general-purpose
      initContainers:
        # The postgres init ConfigMap creates the polaris role and database.
        - name: wait-postgres
          image: postgres:16
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h polaris-postgres.${namespace}.svc.cluster.local -U polaris -d polaris \
                    -tAc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for postgres (role polaris / db polaris)..."; sleep 3
              done
              echo "postgres ready"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-credentials
                  key: POLARIS_DB_PASSWORD
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.3.0-incubating
          args: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,root,$(ROOT_CLIENT_SECRET)"]
          env:
            - name: ROOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-credentials
                  key: ROOT_CLIENT_SECRET
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: postgresql
            - name: QUARKUS_DATASOURCE_USERNAME
              value: polaris
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-credentials
                  key: POLARIS_DB_PASSWORD
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://polaris-postgres.${namespace}.svc.cluster.local:5432/polaris"
