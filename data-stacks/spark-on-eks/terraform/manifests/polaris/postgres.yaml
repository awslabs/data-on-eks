# Postgres 16 — metastore for the Apache Polaris Iceberg REST catalog.
#
# Passwords come from the Terraform-generated Secret polaris-postgres-credentials
# (see polaris.tf); nothing sensitive lives in this file. Storage is a PVC on the
# cluster's default StorageClass so the catalog metadata survives pod restarts.
#
# Resource names are prefixed "polaris-" to stay distinct from DataHub's own
# "postgresql" StatefulSet, which may run in the same cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-postgres-init
  namespace: ${namespace}
data:
  10-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
      CREATE ROLE polaris LOGIN PASSWORD '$POLARIS_DB_PASSWORD';
      CREATE DATABASE polaris OWNER polaris;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polaris-postgres-data
  namespace: ${namespace}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-postgres
  namespace: ${namespace}
  labels:
    app: polaris-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polaris-postgres
  template:
    metadata:
      labels:
        app: polaris-postgres
    spec:
      nodeSelector:
        NodeGroupType: general-purpose
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POLARIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-credentials
                  key: POLARIS_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polaris-postgres-data
        - name: init
          configMap:
            name: polaris-postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-postgres
  namespace: ${namespace}
spec:
  selector:
    app: polaris-postgres
  ports:
    - port: 5432
      targetPort: pg
