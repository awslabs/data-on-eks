apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: memory-optimized-graviton
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/workload-type: memory-optimized-graviton
        node.kubernetes.io/instance-category: memory
        node.kubernetes.io/arch: arm64
        NodeGroupType: SparkGravitonMemoryOptimized

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-1000gi-6000iops-1000tp

      requirements:
        # On-demand only: the event store (ClickHouse, one replica) runs here, and its pod spec
        # comes from the upstream repo, so it cannot select a capacity type itself.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["r"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["r6g", "r6gd", "r7g", "r7gd", "r8g", "r8gd", "x8g", "x2gd"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge", "2xlarge", "4xlarge", "8xlarge", "12xlarge", "16xlarge"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

  disruption:
    # The event store (ClickHouse, one replica) runs here. Consolidation moved it twice in one
    # load run, about 1 min of no ingest each time.
    consolidationPolicy: WhenEmpty
    consolidateAfter: "600s"

  weight: 25
