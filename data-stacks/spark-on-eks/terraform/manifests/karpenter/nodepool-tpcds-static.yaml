apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: tpcds-static
  namespace: karpenter
spec:
  # Alpha (feature gate staticCapacity). Fixed node count, independent of pending pods.
  # 0 between test runs, because static nodes run (and cost money) without pods.
  replicas: 0
  template:
    metadata:
      labels:
        NodeGroupType: tpcds-static
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-40gi-6000iops-1000tp
      taints:
        - key: dedicated
          value: tpcds-static
          effect: NoSchedule
      expireAfter: Never
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # More types give more EC2 capacity in one AZ. App capacity per node changes with the
        # type, so set the Locust rate from the total vCPU after the nodes are up.
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - r6g.4xlarge
            - r6g.8xlarge
            - r6g.12xlarge
            - r7g.4xlarge
            - r7g.8xlarge
            - r7g.12xlarge
            - r8g.4xlarge
            - r8g.8xlarge
            - r8g.12xlarge
            - r8gd.8xlarge
        # Static nodes do not follow pod zones. Zone ID, because zone names differ per account.
        - key: topology.k8s.aws/zone-id
          operator: In
          values: ["use1-az6"]
  disruption:
    # Required by the CRD schema; ignored when replicas is set.
    consolidateAfter: Never
    # Drift would replace nodes during a test.
    budgets:
      - nodes: "0"
