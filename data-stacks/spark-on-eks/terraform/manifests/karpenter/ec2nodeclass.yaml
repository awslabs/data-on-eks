apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ebs-gp3-1000gi-6000iops-1000tp-x86
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  instanceStorePolicy: RAID0

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 1000Gi
        volumeType: gp3
        iops: 6000
        throughput: 1000
        encrypted: true
        deleteOnTermination: true

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. It needs cgroup v2, which AL2023 has.
            MemoryQoS: true
          # 0.7 starts page cache reclaim earlier. This prevents OOMKills in Spark.
          # memory.high = request + 0.7 * (limit - request).
          memoryThrottlingFactor: 0.7
          # static gives exclusive cores to Guaranteed pods with integer CPU. full-pcpus-only stops
          # two pods from sharing SMT siblings. Cache alignment helps only on split-LLC CPUs.
          cpuManagerPolicy: static
          cpuManagerPolicyOptions:
            full-pcpus-only: "true"
            prefer-align-cpus-by-uncorecache: "true"
          # The static policy needs reserved CPU above 0, or kubelet does not start. 2 vCPUs is one
          # physical core on SMT x86, so full-pcpus-only does not strand SMT siblings.
          kubeReserved:
            cpu: 1000m
          systemReserved:
            cpu: 1000m

    --//--

