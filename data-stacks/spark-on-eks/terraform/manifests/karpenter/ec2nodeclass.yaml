apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: streaming-optimized
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  instanceStorePolicy: RAID0

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 6000
        throughput: 300
        encrypted: true
        deleteOnTermination: true

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. It needs cgroup v2, which AL2023 has.
            MemoryQoS: true
          # Kubernetes default. memory.high = request + 0.9 * (limit - request).
          memoryThrottlingFactor: 0.9

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash

    set -ex

    # Network tuning for low-latency Flink streaming.
    echo 'net.core.rmem_max=134217728' >> /etc/sysctl.conf
    echo 'net.core.wmem_max=134217728' >> /etc/sysctl.conf
    echo 'net.ipv4.tcp_rmem=4096 87380 134217728' >> /etc/sysctl.conf
    echo 'net.ipv4.tcp_wmem=4096 16384 134217728' >> /etc/sysctl.conf
    echo 'net.ipv4.tcp_congestion_control=bbr' >> /etc/sysctl.conf
    echo 'net.core.netdev_max_backlog=30000' >> /etc/sysctl.conf
    echo 'net.ipv4.tcp_slow_start_after_idle=0' >> /etc/sysctl.conf
    sysctl -p

    --//--

  tags:
    stack: flink-on-eks
    Environment: dev
    WorkloadType: streaming
    OptimizedFor: low-latency-networking

