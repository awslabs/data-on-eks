apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  instanceStorePolicy: RAID0

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. It needs cgroup v2, which AL2023 has.
            MemoryQoS: true
          # Kubernetes default. memory.high = request + 0.9 * (limit - request).
          memoryThrottlingFactor: 0.9

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    mkdir -p /mnt/spark-local

    # Spark images run as UID 185.
    chown -R 185:185 /mnt/spark-local
    chmod 755 /mnt/spark-local

    --//--

---
# GPU node class. FastImagePull (SOCI parallel pull) makes large inference images pull faster.
# See website/docs/bestpractices/analytics/soci-spark-image-pulls.md.
# FastImagePull has no effect below 4 vCPU or 7 GiB. The gpu NodePool starts at xlarge.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  # On GPU types with NVMe instance store (g6e, g6, g5), SOCI unpacks to NVMe, not to EBS.
  instanceStorePolicy: RAID0

  # For GPU types without instance store. Parallel pull makes disk throughput the limit,
  # so throughput is above the gp3 default of 125 MiB/s.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 3000
        throughput: 600
        encrypted: true
        deleteOnTermination: true

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      featureGates:
        # Experimental. nodeadm writes the SOCI snapshotter configuration.
        FastImagePull: true
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. It needs cgroup v2, which AL2023 has.
            MemoryQoS: true
          # Kubernetes default. memory.high = request + 0.9 * (limit - request).
          memoryThrottlingFactor: 0.9
          # Pull the inference image and the DaemonSet images at the same time on a new node.
          serializeImagePulls: false
          maxParallelImagePulls: 5
          registryPullQPS: 50
          registryBurst: 100

    --//--

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-vertical-ebs-scale
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  instanceStorePolicy: RAID0

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. It needs cgroup v2, which AL2023 has.
            MemoryQoS: true
          # 0.7 starts page cache reclaim earlier. This prevents OOMKills in Spark.
          # memory.high = request + 0.7 * (limit - request).
          memoryThrottlingFactor: 0.7

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    echo "Running a custom user data script"
    set -ex
    yum install mdadm -y

    IDX=1
    DEVICES=$(lsblk -o NAME,TYPE -dsn | awk '/disk/ {print $1}')

    DISK_ARRAY=()

    for DEV in $DEVICES
    do
      DISK_ARRAY+=("/dev/$${DEV}")
    done

    DISK_COUNT=$${#DISK_ARRAY[@]}

    if [ $${DISK_COUNT} -eq 0 ]; then
      echo "No SSD disks available. Creating new EBS volume according to number of cores available in the node."
      yum install -y jq awscli
      TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 3600")

      INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
      AVAILABILITY_ZONE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
      REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone | sed 's/[a-z]$//')

      CORES=$(nproc --all)

      VOLUME_SIZE=$(expr $CORES \* 10) # 10GB per core. Change as desired

      VOLUME_ID=$(aws ec2 create-volume --availability-zone $AVAILABILITY_ZONE --size $VOLUME_SIZE --volume-type gp3 --region $REGION --output text --query 'VolumeId')

      while [ "$(aws ec2 describe-volumes --volume-ids $VOLUME_ID --region $REGION --query "Volumes[*].State" --output text)" != "available" ]; do
        echo "Waiting for volume to become available"
        sleep 5
      done

      aws ec2 attach-volume --volume-id $VOLUME_ID --instance-id $INSTANCE_ID --device /dev/xvdb --region $REGION

      aws ec2 modify-instance-attribute --instance-id $INSTANCE_ID --block-device-mappings "[{\"DeviceName\": \"/dev/xvdb\",\"Ebs\":{\"DeleteOnTermination\":true}}]" --region $REGION

      while [ "$(aws ec2 describe-volumes --volume-ids $VOLUME_ID --region $REGION --query "Volumes[*].Attachments[*].State" --output text)" != "attached" ]; do
        echo "Waiting for volume to be attached"
        sleep 5
      done

      sudo mkfs -t ext4 /dev/xvdb # Improve this to get this value dynamically
      sudo mkdir /mnt/k8s-disks # Change directory as you like
      sudo mount /dev/xvdb /mnt/k8s-disks
      echo "/dev/xvdb /mnt/k8s-disks ext4 defaults,nofail 0 2" | sudo tee -a /etc/fstab

      /usr/bin/chown -hR +999:+1000 /mnt/k8s-disks
    else
      if [ $${DISK_COUNT} -eq 1 ]; then
        TARGET_DEV=$${DISK_ARRAY[0]}
        mkfs.xfs $${TARGET_DEV}
      else
        mdadm --create --verbose /dev/md0 --level=0 --raid-devices=$${DISK_COUNT} $${DISK_ARRAY[@]}
        mkfs.xfs /dev/md0
        TARGET_DEV=/dev/md0
      fi

      mkdir -p /mnt/k8s-disks
      echo $${TARGET_DEV} /mnt/k8s-disks xfs defaults,noatime 1 2 >> /etc/fstab
      mount -a
      /usr/bin/chown -hR +999:+1000 /mnt/k8s-disks
    fi

    --//--

