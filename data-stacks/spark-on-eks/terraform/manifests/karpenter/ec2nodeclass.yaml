# Node class for the local static provisioner. Each NVMe disk stays a separate volume.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ephemeral-nvme-local-provisioner
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"
  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"
  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"
  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"
  # To use RAID0, remove the userData below. Then set the provisioner mount path to "/mnt/k8s-disks/".
  # instanceStorePolicy: RAID0
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            # MemoryQoS is alpha and off by default. Near memory.high, the kernel reclaims page cache
            # (shuffle files, S3A buffers) before an OOMKill. AL2023 has cgroup v2.
            MemoryQoS: true
          # 0.7 starts page cache reclaim earlier. Example: request 80Gi and limit 96Gi
          # give memory.high = 80 + 0.7 * (96 - 80) = 91.2Gi.
          memoryThrottlingFactor: 0.7

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash

    set -ex

    cat <<EOF > /etc/udev/rules.d/90-kubernetes-discovery.rules
    # Discover Instance Storage disks so kubernetes local provisioner can pick them up from /dev/disk/kubernetes
    KERNEL=="nvme[0-9]*n[0-9]*", ENV{DEVTYPE}=="disk", ATTRS{model}=="Amazon EC2 NVMe Instance Storage", ATTRS{serial}=="?*", SYMLINK+="disk/kubernetes/nvme-\\\$attr{model}_\\\$attr{serial}", OPTIONS="string_escape=replace"
    EOF

    udevadm control --reload && udevadm trigger

    --//--

---
# Dedicated node for the Spark Operator controller. The subnet pattern matches only the
# primary CIDR subnets (for example spark-on-eks-private-us-west-2a), not "-private-secondary*".
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-operator
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-${REGION}*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
