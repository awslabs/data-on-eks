# TPC-DS static pool. The gp3 quota is per Region in TiB. A node uses about 12 GB (OS, images, one app).
# 40Gi keeps 6000 IOPS and 1000 MiB/s. The minimum gp3 size for these values is 12Gi.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ebs-gp3-40gi-6000iops-1000tp
  namespace: karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"

  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"

  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"

  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"

  instanceStorePolicy: RAID0

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        iops: 6000
        throughput: 1000
        encrypted: true
        deleteOnTermination: true

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          featureGates:
            MemoryQoS: true
          # Same as ebs-gp3-1000gi-6000iops-1000tp.
          memoryThrottlingFactor: 0.7

    --//--

