apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: memory-optimized-x86
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/workload-type: memory-optimized-x86
        node.kubernetes.io/instance-category: memory
        node.kubernetes.io/arch: amd64
        NodeGroupType: SparkMemoryOptimized

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-1000gi-6000iops-1000tp-x86

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["r", "x"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["r5", "r5d", "r5n", "r6a", "r6i", "r6id", "r6idn", "r6in", "r7i", "r7id", "x1e", "x2iezn"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge", "8xlarge", "12xlarge", "16xlarge", "24xlarge", "32xlarge"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "600s"  # Longer wait for memory workloads

  weight: 20
