# Dedicated NodePool for the Spark Operator controller (8 CPU) and the REST submitter
# (3 x 10 CPU, spark-submitter.tf). The label and taint match the nodeSelector and toleration of both.
# The taint keeps all other pods off these nodes.
# Disruption is blocked, so Karpenter does not replace the nodes during a load test.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-operator
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        NodeGroupType: spark-operator-benchmark
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark-operator
      taints:
        - key: dedicated
          value: spark-operator
          effect: NoSchedule
      expireAfter: Never
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6a", "c7a", "c7i"]
        # 12xlarge = 48 vCPU, 96 GiB.
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["12xlarge"]
  # Two nodes. During the change from in-controller spark-submit, the old 36 CPU controller and
  # the submitters do not fit on one node. The second node also keeps submit CPU off the controller.
  limits:
    cpu: "96"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: Never
    # Block all voluntary disruption (drift, consolidation, empty).
    budgets:
      - nodes: "0"
  weight: 50
