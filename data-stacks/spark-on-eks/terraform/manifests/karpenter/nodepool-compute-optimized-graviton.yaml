apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: compute-optimized-graviton
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/workload-type: compute-optimized-graviton
        node.kubernetes.io/instance-category: compute
        node.kubernetes.io/arch: arm64
        NodeGroupType: SparkGravitonComputeOptimized

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-1000gi-6000iops-1000tp

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6g", "c6gd", "c6gn", "c7g", "c7gd", "c7gn", "c8g", "c8gd"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge", "2xlarge", "4xlarge", "8xlarge", "12xlarge", "16xlarge"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "600s"

  weight: 15
