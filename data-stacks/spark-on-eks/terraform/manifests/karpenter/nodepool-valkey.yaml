apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: valkey
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        NodeGroupType: valkey
        workload: valkey

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-1000gi-6000iops-1000tp

      taints:
        - key: workload
          value: valkey
          effect: NoSchedule

      requirements:
        # On-demand only, because Valkey is stateful.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        # r7g/r8g for typical Valkey use. r7gn/r8gn/m7gn for network throughput above 10 Gbps
        # or large PSYNC resyncs. Pods select them with nodeAffinity.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["r7g", "r8g", "r7gn", "r8gn", "m7gn"]

        # Above 16xlarge, ENI pod density limits apply without VPC CNI prefix delegation.
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge", "8xlarge", "12xlarge", "16xlarge"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: topology.kubernetes.io/zone
          operator: Exists

  # WhenEmptyOrUnderutilized would move stateful pods and cause BGSAVE fork load.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: "1h"

  # Higher than the general-purpose pools, so Valkey pods land here first.
  weight: 50
