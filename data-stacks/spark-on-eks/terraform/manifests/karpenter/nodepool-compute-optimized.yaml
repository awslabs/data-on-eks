apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: compute-optimized-x86
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/workload-type: compute-optimized-x86
        node.kubernetes.io/instance-category: compute
        node.kubernetes.io/arch: amd64
        NodeGroupType: SparkComputeOptimized

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ebs-gp3-1000gi-6000iops-1000tp-x86

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5", "c5d", "c5n", "c6a", "c6i", "c6id", "c6in", "c7i", "c7id"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge", "8xlarge", "12xlarge", "16xlarge", "24xlarge"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "600s"

  weight: 10
