# Sets IOPS and throughput on existing Celeborn EBS volumes without a pod restart. Patch each PVC to use it.
#
# gp3 maximums: 16,000 IOPS, 1,000 MiB/s, 64 TiB.
#
# To change IOPS and throughput only:
#   kubectl patch pvc disk1-celeborn-worker-0 -n celeborn --type=merge -p \
#     '{"spec":{"volumeAttributesClassName":"celeborn-gp3-high"}}'
#
# To change size, IOPS, and throughput, use one patch. EBS allows 4 modifications per volume in 24 hours:
#   kubectl patch pvc disk1-celeborn-worker-0 -n celeborn --type=merge -p \
#     '{"spec":{"resources":{"requests":{"storage":"2000Gi"}},"volumeAttributesClassName":"celeborn-gp3-high"}}'
#
# A size change needs allowVolumeExpansion: true on the StorageClass. gp3-faster has it.
apiVersion: storage.k8s.io/v1
kind: VolumeAttributesClass
metadata:
  name: celeborn-gp3-high
driverName: ebs.csi.aws.com
parameters:
  iops: "10000"
  throughput: "1000"
