# Apache Polaris (Iceberg REST catalog) from the community chart. See polaris.tf.
# The chart does not bootstrap the realm. manifests/polaris/bootstrap-job.yaml does it.
# The catalog uses stsUnavailable=true, so each engine uses its own AWS identity.

# In-cluster clients use the fixed name polaris.<namespace>.svc.cluster.local:8181.
fullnameOverride: polaris

image:
  repository: apache/polaris
  tag: "1.3.0-incubating"
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ${service_account_name}
  # Pod Identity needs no annotation. module.polaris_pod_identity creates the association.
  annotations: {}

persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-persistence
      username: username
      password: password
      jdbcUrl: jdbcUrl

realmContext:
  type: default
  realms:
    - POLARIS

extraEnv:
  - name: AWS_REGION
    value: ${region}
  - name: JAVA_OPTS_APPEND
    value: "-XX:MaxRAMPercentage=50.0"

# Without this gate, the server crash-loops until the bootstrap Job creates the schema.
extraInitContainers:
  - name: wait-bootstrap
    image: postgres:16
    command: ["/bin/sh", "-c"]
    args:
      - |
        until psql -h polaris-postgres.${namespace}.svc.cluster.local -U polaris -d polaris \
              -tAc "SELECT 1 FROM polaris_schema.version LIMIT 1" >/dev/null 2>&1; do
          echo "waiting for polaris bootstrap..."; sleep 3
        done
        echo "bootstrap present"
    env:
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: polaris-postgres-credentials
            key: POLARIS_DB_PASSWORD

# Internal only. For production, use an internal load balancer, never a public endpoint.
service:
  type: ClusterIP
  ports:
    - name: polaris-http
      port: 8181

managementService:
  type: ClusterIP
  ports:
    - name: polaris-mgmt
      port: 8182
  clusterIP: None

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

podLabels:
  app: polaris
