# EMR Spark Operator 7.12.0: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/spark-operator-gs.html

replicaCount: 1

webhook:
  enable: true
  port: 8080

emrContainers:
  awsRegion: ${aws_region}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
