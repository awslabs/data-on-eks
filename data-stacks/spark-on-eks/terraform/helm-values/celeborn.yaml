image:
  pullPolicy: IfNotPresent
  tag: 0.6.2

serviceAccount:
  create: true
  name: "celeborn"

cluster:
  name: cluster

# Server-side settings (celeborn-defaults.conf). These keys have no spark. prefix.
celeborn:
  # capacity is 900Gi on a 1000Gi PVC. This leaves about 10% for file system overhead.
  celeborn.worker.storage.dirs: /mnt/disk1:disktype=SSD:capacity=900Gi,/mnt/disk2:disktype=SSD:capacity=900Gi,/mnt/disk3:disktype=SSD:capacity=900Gi,/mnt/disk4:disktype=SSD:capacity=900Gi

  # Memory keeps hot data. SSD keeps overflow.
  celeborn.storage.availableTypes: MEMORY,SSD

  celeborn.worker.storage.storagePolicy.evictPolicy: MEMORY,SSD

  # Thread counts for r8g.8xlarge (32 vCPU, 256 GB).
  celeborn.worker.flusher.ssd.threads: "64"
  celeborn.worker.fetch.io.threads: "64"
  celeborn.worker.push.io.threads: "64"
  celeborn.worker.clean.threads: "128"
  celeborn.worker.commitFiles.threads: "128"
  celeborn.worker.disk.clean.threads: "16"
  celeborn.worker.sortPartition.threads: "128"
  celeborn.worker.flusher.buffer.size: "10m"

  # The worker keeps in-flight partition metadata in RocksDB for restart.
  # See https://celeborn.apache.org/docs/latest/upgrading/#worker
  celeborn.worker.graceful.shutdown.enabled: "true"
  celeborn.worker.graceful.shutdown.checkSlotsFinished.timeout: "480s"   # default: 480s
  celeborn.worker.graceful.shutdown.partitionSorter.shutdownTimeout: "120s"  # default: 120s
  celeborn.worker.graceful.shutdown.timeout: "600s"                      # default: 600s

  celeborn.worker.graceful.shutdown.recoverPath: "/mnt/disk1/recover"

  # Graceful shutdown requires fixed worker ports. Clients keep host:port, so a changed port fails all requests.
  # See https://celeborn.apache.org/docs/latest/configuration/
  celeborn.worker.rpc.port: "9091"
  celeborn.worker.fetch.port: "9092"
  celeborn.worker.push.port: "9093"
  celeborn.worker.replicate.port: "9094"

  # The default can be too short for EBS.
  celeborn.worker.replicate.fastFail.duration: "240s"

  # EBS detach and reattach can take 60-120s. The default timeout of 120s is too short.
  celeborn.master.heartbeat.worker.timeout: "180s"

  # Workers register with their stable DNS name. The pod IP changes after a restart.
  # See https://celeborn.apache.org/docs/latest/deploy_on_k8s/
  celeborn.network.bind.preferIpAddress: "false"

  # Time a decommissioning worker waits before it exits. These are the defaults.
  # See https://celeborn.apache.org/docs/latest/decommissioning/
  celeborn.worker.decommission.forceExitTimeout: "6h"    # default: 6h
  celeborn.worker.decommission.checkInterval: "30s"      # default: 30s

  # S3 tier. Keep disabled until it is stable in 0.6.x.
  # celeborn.storage.availableTypes: MEMORY,SSD,S3
  # celeborn.storage.s3.dir: s3://${s3_bucket}/celeborn
  # celeborn.storage.s3.endpoint.region: ${s3_bucket_region}

master:
  nodeSelector:
    NodeGroupType: general-purpose
  env:
    - name: CELEBORN_MASTER_MEMORY
      value: 2g
    - name: CELEBORN_MASTER_JAVA_OPTS
      value: -XX:+UseG1GC -XX:MaxGCPauseMillis=500 -XX:+PrintGCDetails -XX:+PrintGCDateStamps -Xloggc:gc-master.out -Dio.netty.leakDetectionLevel=advanced
    - name: CELEBORN_NO_DAEMONIZE
      value: "true"
    - name: TZ
      value: Etc/GMT

worker:
  replicas: 6
  # The chart does not support podLabels. Use kubectl patch to add the YuniKorn queue label.
  # podLabels:
  #   yunikorn.apache.org/queue: root.spark.spark-team-a

  nodeSelector:
    NodeGroupType: SparkGravitonMemoryOptimized
    karpenter.sh/capacity-type: "on-demand"
    kubernetes.io/arch: arm64
    karpenter.k8s.aws/instance-family: "r8g"
    karpenter.k8s.aws/instance-size: "8xlarge"

  env:
    - name: CELEBORN_WORKER_MEMORY
      value: 48g
    - name: CELEBORN_WORKER_OFFHEAP_MEMORY
      # JVM total is 228g (48g heap + 180g off-heap). The pod limit is 240Gi.
      # If the node has OOM events, decrease off-heap to 160g.
      value: 180g
    - name: CELEBORN_WORKER_JAVA_OPTS
      # G1 prevents long stop-the-world pauses on a 48g heap.
      value: -XX:+UseG1GC -XX:G1HeapRegionSize=32m -XX:MaxGCPauseMillis=500 -XX:+PrintGCDetails -XX:+PrintGCDateStamps -Xloggc:gc-worker.out -Dio.netty.leakDetectionLevel=advanced
    - name: CELEBORN_NO_DAEMONIZE
      value: "true"
    - name: TZ
      value: Etc/GMT

  resources:
    requests:
      cpu: "26"
      memory: "220Gi"
    limits:
      memory: "240Gi"
      # No CPU limit. CFS throttling makes the JVM slow.

  # PVC retention is Retain, so data stays after a pod restart.
  volumeClaimTemplates:
    - metadata:
        name: disk1
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-faster # do not use default
        volumeAttributesClassName: celeborn-gp3-high
        resources:
          requests:
            storage: 1000Gi
    - metadata:
        name: disk2
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-faster # do not use default
        volumeAttributesClassName: celeborn-gp3-high
        resources:
          requests:
            storage: 1000Gi
    - metadata:
        name: disk3
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-faster # do not use default
        volumeAttributesClassName: celeborn-gp3-high
        resources:
          requests:
            storage: 1000Gi
    - metadata:
        name: disk4
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-faster # do not use default
        volumeAttributesClassName: celeborn-gp3-high
        resources:
          requests:
            storage: 1000Gi

  volumeMounts:
    - name: disk1
      mountPath: /mnt/disk1
    - name: disk2
      mountPath: /mnt/disk2
    - name: disk3
      mountPath: /mnt/disk3
    - name: disk4
      mountPath: /mnt/disk4

  volumes: {}
