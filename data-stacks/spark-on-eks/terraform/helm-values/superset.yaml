# The official image does not include the PostgreSQL client binary.
# https://github.com/apache/superset/discussions/31431
# https://superset.apache.org/docs/installation/docker-builds/#building-your-own-production-docker-image
# Dockerfile: data-stacks/workshop/src/superset/Dockerfile
image:
  repository: public.ecr.aws/data-on-eks/data-stacks
  tag: superset-v0.0.2
  pullPolicy: IfNotPresent

supersetNode:
  connections:
    db_host: "postgresql"
    db_port: "5432"
    db_user: superset
    db_name: superset
    redis_host: "redis"
    redis_port: "6379"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  resources:
     limits:
      memory: 1024Mi
     requests:
      cpu: 500m
      memory: 512Mi

extraEnvRaw:
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: postgresql-secrets
        key: password
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: postgresql-secrets
        key: secret-key


supersetWorker:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 2048Mi
  persistence:
    enabled: true

# init:
#   loadExamples: true

# The chart uses the Bitnami PostgreSQL and Redis charts. They are no longer maintained.
postgresql:
  enabled: false

redis:
  enabled: false
runAsUser: 1000
