controller:
  replicas: 1
  # This list replaces the chart default, so it must contain all gates.
  featureGates:
    - name: PartialRestart
      enabled: false
    - name: LoadSparkDefaults
      enabled: false
    - name: RestSubmitter
      enabled: true
    - name: DefaultTimeToLive
      enabled: false
  # At 84 running apps the operator sent 128 req/s. Sized for about 1,000 running apps.
  workers: 100
  kubeAPIQPS: 2000
  kubeAPIBurst: 4000
  # Every Spark pod event takes one token. At 746 nodes this was 118/s, so 100 QPS made the
  # delay before each reconcile grow by about 0.18 s every second.
  workqueueRateLimiter:
    bucketQPS: 1000
    bucketSize: 10000
%{ if enable_ipv6 ~}
  env:
    - name: _JAVA_OPTIONS
      value: "-Djava.net.preferIPv6Addresses=true"
    - name: KUBERNETES_DISABLE_HOSTNAME_VERIFICATION
      value: "true"
%{ endif ~}
  # Run on the dedicated Spark Operator node group (c6a.12xlarge, tainted).
  nodeSelector:
    NodeGroupType: spark-operator-benchmark
  tolerations:
    - key: dedicated
      operator: Equal
      value: spark-operator
      effect: NoSchedule
  # The spark-submit JVMs run in the submitter (spark-submitter.tf), not here.
  resources:
    requests:
      cpu: "8"
      memory: 16Gi
    limits:
      memory: 16Gi
submitter:
  serviceUrl: http://spark-submitter-svc.spark-submitter.svc.cluster.local:8080/api/v1/spark-submit
batchScheduler:
  # -- Enable batch scheduler support
  enable: false
  # -- Default batch scheduler (will be overridden by user values)
  default: "yunikorn"
webhook:
  enable: false
  nodeSelector:
    NodeGroupType: core
spark:
  # -- List of namespaces where to run spark jobs.
  # If empty string is included, all namespaces will be allowed.
  jobNamespaces:
    - default
    - spark-team-a
    - spark-team-b
    - spark-team-c
    - spark-s3-express
  serviceAccount:
    # -- Specifies whether to create a service account for spark applications.
    create: false
  rbac:
    # -- Specifies whether to create RBAC resources for spark applications.
    create: false
prometheus:
  metrics:
    enable: true
    port: 8080
    portName: metrics
    endpoint: /metrics
    prefix: ""
  # Prometheus pod monitor for controller pods
  # Note: The kube-prometheus-stack addon must deploy before the PodMonitor CRD is available.
  #       This can cause the terraform apply to fail since the addons are deployed in parallel
  podMonitor:
    # -- Specifies whether to create pod monitor.
    create: true
    labels: {}
    # -- The label to use to retrieve the job name from
    jobLabel: spark-operator-podmonitor
    # -- Prometheus metrics endpoint properties. `metrics.portName` will be used as a port
    podMetricsEndpoint:
      scheme: http
      interval: 15s
