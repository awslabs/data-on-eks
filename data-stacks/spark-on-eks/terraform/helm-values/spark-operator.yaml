controller:
  replicas: 1
  # -- Tuned for about 200 SparkApplications per minute.
  workers: 50
  kubeAPIQPS: 100
  kubeAPIBurst: 200
  workqueueRateLimiter:
    bucketQPS: 100
    bucketSize: 1000
%{ if enable_ipv6 ~}
  env:
    - name: _JAVA_OPTIONS
      value: "-Djava.net.preferIPv6Addresses=true"
    - name: KUBERNETES_DISABLE_HOSTNAME_VERIFICATION
      value: "true"
%{ endif ~}
  # Run on the dedicated Spark Operator node group (c6a.12xlarge, tainted).
  nodeSelector:
    NodeGroupType: spark-operator-benchmark
  tolerations:
    - key: dedicated
      operator: Equal
      value: spark-operator
      effect: NoSchedule
  # The controller runs one spark-submit JVM for each SparkApplication (CPU bound).
  resources:
    requests:
      cpu: "36"
      memory: 50Gi
    limits:
      memory: 50Gi
batchScheduler:
  # -- Enable batch scheduler support
  enable: false
  # -- Default batch scheduler (will be overridden by user values)
  default: "yunikorn"
webhook:
  enable: false
  nodeSelector:
    NodeGroupType: core
spark:
  # -- List of namespaces where to run spark jobs.
  # If empty string is included, all namespaces will be allowed.
  jobNamespaces:
    - default
    - spark-team-a
    - spark-team-b
    - spark-team-c
    - spark-s3-express
  serviceAccount:
    # -- Specifies whether to create a service account for spark applications.
    create: false
  rbac:
    # -- Specifies whether to create RBAC resources for spark applications.
    create: false
prometheus:
  metrics:
    enable: true
    port: 8080
    portName: metrics
    endpoint: /metrics
    prefix: ""
  # Prometheus pod monitor for controller pods
  # Note: The kube-prometheus-stack addon must deploy before the PodMonitor CRD is available.
  #       This can cause the terraform apply to fail since the addons are deployed in parallel
  podMonitor:
    # -- Specifies whether to create pod monitor.
    create: true
    labels: {}
    # -- The label to use to retrieve the job name from
    jobLabel: spark-operator-podmonitor
    # -- Prometheus metrics endpoint properties. `metrics.portName` will be used as a port
    podMetricsEndpoint:
      scheme: http
      interval: 15s
