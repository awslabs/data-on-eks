server:
  workers: 1
  exchangeManager:
    name: filesystem
    baseDir: "s3://${exchange_bucket_id}"
  autoscaling:
    enabled: false
  config:
    query:
      maxMemory: "280GB"
      initialHashPartitions: 100
      maxStageRetries: 3
      maxExecutionTime: "24h"
      clientTimeout: "2h"

service:
  type: ClusterIP
  port: 8080

coordinator:
  jvm:
    maxHeapSize: "32G"
    extraArguments:
      - "-XX:+UseG1GC"
      - "-XX:G1HeapRegionSize=32M"
      - "-XX:+UseGCOverheadLimit"
      - "-XX:+ExitOnOutOfMemoryError"
      - "-XX:ReservedCodeCacheSize=256M"
      - "-Djdk.attach.allowAttachSelf=true"
      - "-XX:+UseContainerSupport"
  config:
    query:
      maxMemoryPerNode: "6GB"
      minWorkers: 1
      initialHashPartitions: 100
  resources:
    requests:
      cpu: "4000m"
      memory: 40Gi
    limits:
      cpu: "6000m"
      memory: 40Gi
  annotations:
    karpenter.sh/do-not-disrupt: "true"
  nodeSelector:
    karpenter.k8s.aws/instance-family: "r8g"
    karpenter.sh/capacity-type: on-demand
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          component: coordinator

worker:
  jvm:
    maxHeapSize: "12G"
    extraArguments:
      - "-XX:+UseG1GC"
      - "-XX:G1HeapRegionSize=32M"
      - "-XX:+UseGCOverheadLimit"
      - "-XX:+ExitOnOutOfMemoryError"
      - "-XX:ReservedCodeCacheSize=256M"
      - "-Djdk.attach.allowAttachSelf=true"
      - "-XX:+UseContainerSupport"
  config:
    query:
      maxMemoryPerNode: "6GB"
  resources:
    requests:
      cpu: "4000m"
      memory: 40Gi
    limits:
      cpu: "6000m"
      memory: 40Gi
  nodeSelector:
    karpenter.k8s.aws/instance-family: "r8g"
    karpenter.sh/capacity-type: on-demand
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          component: worker

additionalConfigProperties:
  - "retry-policy=TASK"
  - "exchange.compression-enabled=true"
  - "query.remote-task.max-error-duration=1m"
  - "query.max-hash-partition-count=100"
  - "spill-enabled=false"
  - "spiller-spill-path=/tmp/spill"
  - "memory.heap-headroom-per-node=1.6GB"
  - "optimizer.join-reordering-strategy=AUTOMATIC"
  - "query.max-history=100"
  - "query.client.timeout=30m"
  - "sink.max-buffer-size=1GB"

additionalExchangeManagerProperties:
  - "exchange-manager.name=filesystem"
  - "exchange.base-directories=s3://${exchange_bucket_id}"
  - "exchange.s3.region=${region}"
  - "exchange.s3.endpoint=https://s3.${region}.amazonaws.com"
  - "exchange.s3.max-error-retries=10"
  - "exchange.s3.upload.part-size=64MB"

additionalCatalogs:
  hive: |-
    connector.name=hive
    hive.metastore=glue
    hive.metastore.glue.region=${region}
    hive.metastore.glue.default-warehouse-dir=s3://${trino_s3_bucket_id}/
    hive.security=allow-all
    fs.native-s3.enabled=true
  iceberg: |-
    connector.name=iceberg
    iceberg.catalog.type=glue
    iceberg.file-format=PARQUET
    iceberg.unique-table-location=true
    iceberg.register-table-procedure.enabled=true
    hive.metastore.glue.region=${region}
    hive.metastore.glue.default-warehouse-dir=s3://${trino_s3_bucket_id}/
    fs.native-s3.enabled=true
%{ if enable_polaris ~}
  # Apache Polaris Iceberg REST catalog. Added only when enable_polaris=true.
  # The OAuth2 credential is read from the POLARIS_OAUTH2_CREDENTIAL env var,
  # injected via the envFrom secretRef below (never inlined here).
  polaris: |-
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://polaris.${polaris_namespace}.svc.cluster.local:8181/api/catalog
    iceberg.rest-catalog.warehouse=${polaris_catalog}
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=$${ENV:POLARIS_OAUTH2_CREDENTIAL}
    iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
    iceberg.rest-catalog.oauth2.server-uri=http://polaris.${polaris_namespace}.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
    iceberg.rest-catalog.vended-credentials-enabled=false
    iceberg.file-format=PARQUET
    fs.native-s3.enabled=true
    s3.region=${region}
%{ endif ~}

serviceAccount:
  create: true
  name: ${trino_sa}
%{ if enable_polaris ~}

# Polaris OAuth2 client credential (root:<secret>), injected into every Trino
# pod so the 'polaris' catalog can authenticate. The Secret is created in the
# trino namespace by polaris.tf. Present only when enable_polaris=true.
envFrom:
  - secretRef:
      name: ${polaris_secret_name}
%{ endif ~}

ingress:
  enabled: false

jmx:
  enabled: true
  registryPort: 9080
  serverPort: 9081
  exporter:
    enabled: true
    image: bitnamisecure/jmx-exporter:latest
    pullPolicy: IfNotPresent
    port: 5556
    configProperties: |-
      hostPort: localhost:{{- .Values.jmx.registryPort }}
      startDelaySeconds: 0
      ssl: false
      lowercaseOutputName: false
      lowercaseOutputLabelNames: false
      whitelistObjectNames: ["trino.execution:name=QueryManager","trino.execution:name=ClusterSizeMonitor","trino.execution:name=SqlTaskManager","trino.execution.executor:name=TaskExecutor","trino.memory:name=ClusterMemoryManager","java.lang:type=Runtime","trino.memory:type=ClusterMemoryPool,name=general","java.lang:type=Memory","trino.memory:type=MemoryPool,name=general"]
      autoExcludeObjectNameAttributes: true
      excludeObjectNameAttributes:
        "java.lang:type=OperatingSystem":
          - "ObjectName"
        "java.lang:type=Runtime":
          - "ClassPath"
          - "SystemProperties"
      rules:
      - pattern: ".*"
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 512Mi

serviceMonitor:
  enabled: true
  labels:
    prometheus: kube-prometheus
  interval: "5s"
  coordinator:
    enabled: true
    labels:
      prometheus: kube-prometheus
  worker:
    enabled: true
    labels:
      prometheus: kube-prometheus
