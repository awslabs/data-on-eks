image:
  repository: quay.io/kuberay/operator
  tag: v1.6.1
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector:
  NodeGroupType: core

# Leave commented out to watch all namespaces.
# watchNamespace: ""

leaderElectionEnabled: true

logging:
  stdoutEncoder: json
  fileEncoder: json

batchScheduler:
  enabled: false
  # Allowed values: yunikorn, volcano, scheduler-plugins.
  name: ""

# The v1.6.x chart defaults also enable RayMultiHostIndexing.
featureGates:
  - name: RayClusterStatusConditions
    enabled: true
  - name: RayJobDeletionPolicy
    enabled: true

metrics:
  enabled: true
  serviceMonitor:
    # Requires kube-prometheus-stack.
    enabled: true
    interval: 30s
    labels: {}

rbacEnable: true
crNamespacedRbacEnable: true

serviceAccount:
  create: true
  name: kuberay-operator

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
