# NVIDIA GPU Operator v25.10.1. Defaults:
# https://github.com/NVIDIA/gpu-operator/blob/v25.10.1/deployments/gpu-operator/values.yaml

# The AL2023 GPU AMI includes the NVIDIA driver.
driver:
  enabled: false

# The AL2023 GPU AMI includes the NVIDIA Container Toolkit.
toolkit:
  enabled: false

dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    honorLabels: false
    additionalLabels:
      release: kube-prometheus-stack

# The DCGM exporter uses its embedded DCGM.
dcgm:
  enabled: false

migManager:
  enabled: false

nodeStatusExporter:
  enabled: false

gds:
  enabled: false

gdrcopy:
  enabled: false

vgpuManager:
  enabled: false

vgpuDeviceManager:
  enabled: false

vfioManager:
  enabled: false

kataManager:
  enabled: false

sandboxDevicePlugin:
  enabled: false

ccManager:
  enabled: false
