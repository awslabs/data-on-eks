# Valkey values for the official valkey-io/valkey-helm chart: https://github.com/valkey-io/valkey-helm
# The chart supports standalone and replication modes only. Cluster mode is valkey-helm issue #18.

fullnameOverride: valkey
clusterDomain: cluster.local

image:
  registry: docker.io
  repository: valkey/valkey
  pullPolicy: IfNotPresent
  # Empty uses the chart appVersion.
  tag: ""

# The restore initContainer uses this ServiceAccount for Pod Identity.
serviceAccount:
  create: true
  automount: true
  name: ${service_account_name}

# The chart requires the `default` user when auth is enabled. Without it, clients connect without a password.
# Terraform creates the `valkey-auth` Secret with the keys `default` and `replication-user`.
auth:
  enabled: true
  usersExistingSecret: "valkey-auth"
  aclUsers:
    default:
      permissions: "~* &* +@all"
    replication-user:
      permissions: "+psync +replconf +ping"

# minReplicasToWrite: the primary rejects writes when no replica is in sync.
replica:
  enabled: true
  replicas: 3
  replicationUser: "replication-user"
  disklessSync: false
  minReplicasToWrite: 1
  minReplicasMaxLag: 10

  service:
    enabled: true                  # Read service: valkey-read.<ns>.svc...
    type: ClusterIP
    port: 6379

  persistence:
    size: 50Gi                     # required when replica.enabled is true
    storageClass: gp3
    accessModes:
      - ReadWriteOnce

service:
  type: ClusterIP
  port: 6379

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Must match the Valkey NodePool label and taint.
nodeSelector:
  NodeGroupType: valkey

tolerations:
  - key: workload
    operator: Equal
    value: valkey
    effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: valkey

deploymentStrategy: RollingUpdate

# Do not set replica-announce-ip. Valkey does not expand $(POD_NAME) in its config file.
# Replicas reconnect through the stable headless Service hostname.
valkeyConfig: |
  appendonly yes

valkeyLogLevel: "notice"

# Sized for r7g.xlarge (4 vCPU, 32 GiB) at about 50% of memory.
resources:
  requests:
    cpu: 500m
    memory: 12Gi
  limits:
    memory: 16Gi

metrics:
  enabled: true
  service:
    enabled: true
    type: ClusterIP
    ports:
      http: 9121
  serviceMonitor:
    enabled: true
    interval: 30s

# Restores dump.rdb from S3 before Valkey starts, for EC2-to-EKS migration.
# To enable, set RESTORE_ENABLED to "true" and set S3_BUCKET.
# `$$VAR` escapes shell variables for Terraform templatefile.
extraInitContainers:
  - name: restore-rdb
    image: amazon/aws-cli:2.17.0
    imagePullPolicy: IfNotPresent
    env:
      - name: RESTORE_ENABLED
        value: "false"
      - name: AWS_REGION
        value: ${region}
      - name: S3_BUCKET
        value: ""
      - name: S3_PREFIX
        value: "valkey-migration"
      - name: ON_MISSING
        value: "fail"
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        DEST_DIR="/data"
        DEST="$${DEST_DIR}/dump.rdb"
        TMP="$${DEST_DIR}/dump.rdb.partial"

        if [ "$${RESTORE_ENABLED}" != "true" ]; then
          echo "restore: disabled (RESTORE_ENABLED=$${RESTORE_ENABLED}); skipping"
          exit 0
        fi

        # Never overwrite an existing dump.rdb.
        if [ -s "$${DEST}" ]; then
          echo "restore: existing dump.rdb found at $${DEST}; skipping download"
          exit 0
        fi

        if [ -z "$${S3_BUCKET}" ]; then
          echo "restore: S3_BUCKET is empty but RESTORE_ENABLED=true" >&2
          exit 1
        fi

        KEY="$${S3_PREFIX}/dump.rdb"
        echo "restore: checking s3://$${S3_BUCKET}/$${KEY}"

        if ! HEAD=$(aws s3api head-object --bucket "$${S3_BUCKET}" --key "$${KEY}" --region "$${AWS_REGION}" 2>/dev/null); then
          if [ "$${ON_MISSING}" = "skip" ]; then
            echo "restore: object missing; ON_MISSING=skip; exiting 0"
            exit 0
          fi
          echo "restore: object missing at s3://$${S3_BUCKET}/$${KEY}; ON_MISSING=$${ON_MISSING}; failing" >&2
          exit 1
        fi

        EXPECTED=$(echo "$${HEAD}" | awk -F'[:,]' '/"ContentLength"/ {gsub(/[ ]/,"",$$2); print $$2}')
        if [ -z "$${EXPECTED}" ]; then
          echo "restore: could not parse ContentLength from head-object response" >&2
          exit 1
        fi

        echo "restore: downloading $${EXPECTED} bytes to $${TMP}"
        aws s3 cp "s3://$${S3_BUCKET}/$${KEY}" "$${TMP}" --region "$${AWS_REGION}"

        ACTUAL=$(stat -c %s "$${TMP}")
        if [ "$${ACTUAL}" != "$${EXPECTED}" ]; then
          echo "restore: size mismatch — expected=$${EXPECTED} actual=$${ACTUAL}" >&2
          rm -f "$${TMP}"
          exit 1
        fi

        mv "$${TMP}" "$${DEST}"
        echo "restore: placed dump.rdb ($${ACTUAL} bytes) at $${DEST}"
    volumeMounts:
      - name: valkey-data
        mountPath: /data
