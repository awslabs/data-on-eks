hub:
  db:
    pvc:
      storage: 50Gi
      storageClassName: gp3
  authenticatePrometheus: false
proxy:
  https:
    enabled: false
    type: offload
  service:
    type: ClusterIP

singleuser:
  # Root access for debugging. Do not enable it unless it is necessary.
  # extraEnv:
  #   GRANT_SUDO: "yes"
  #   NOTEBOOK_ARGS: "--allow-root"
  # uid: 0
  # allowPrivilegeEscalation: true
  profileList:
    - display_name: Data Engineering (CPU)
      description: "PySpark Notebooks | Karpenter AutoScaling"
      profile_options:
        image:
          display_name: "Image"
          choices:
            pyspark350:
              # CAUTION: Unsupported test image. Review Dockerfile-S3Table-notebook,
              # then build your own image that meets your security requirements.
              display_name: "PySpark 3.5.3 with S3 Tables support"
              default: true
              kubespawner_override:
                image: public.ecr.aws/data-on-eks/spark:pyspark-notebook-3.5.3-s3table0.1.3
            pyspark341: # Use this if you'd like to customize the base image yourself.
              display_name: "PySpark 3.5.3"
              kubespawner_override:
                image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
            pyspark40: # Spark 4.0 with native support for aws sdk v2 (needed for pod identity)
              display_name: "PySpark 4.0.0"
              kubespawner_override:
                image: quay.io/jupyter/pyspark-notebook:spark-4.0.1
      kubespawner_override:
        extra_pod_config:
          dns_policy: ClusterFirst
        node_selector:
          NodeGroupType: "SparkComputeOptimized"
          karpenter.sh/capacity-type: "on-demand"
        cpu_guarantee: 2
        mem_guarantee: 8G
        cpu_limit: 4
        mem_limit: 8G
      cmd: null
  serviceAccountName: ${jupyter_single_user_sa_name}
  uid: 0
  cloudMetadata:
    # CAUTION: Set this to true in almost all cases. The S3 Tables catalog library cannot use
    # IRSA credentials, so the pod must reach the node role through instance metadata.
    blockWithIptables: false
  extraPodConfig: # This is needed for Jovyan user running in every single pod, access the Service Account
    securityContext:
        fsGroup: 100

# Settings from https://z2jh.jupyter.org/en/latest/administrator/optimization.html
scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: false
    replicas: 1
prePuller:
  hook:
    enabled: false
  continuous:
    # With Karpenter, also enable userPlaceholder.
    enabled: false

global:
  safeToShowValues: false
