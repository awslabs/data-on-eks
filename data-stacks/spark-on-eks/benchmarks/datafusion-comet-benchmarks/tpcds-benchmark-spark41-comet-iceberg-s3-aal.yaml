# ============================================================
# TPC-DS v4 3TB on Iceberg: Spark 4.1.3 + Comet 1.2.0 + Iceberg 1.11.0 + S3 Analytics Accelerator
# Comet native Iceberg scan OFF (required for AAL; about 1.5x slower in our tests)
#
# Prerequisites:
#   - Static NodePool from nodepool-tpcds-benchmark.yaml (4 x r8gd.12xlarge, Ready)
#   - kubectl apply -f data-stacks/spark-on-eks/spark-log4j2-configmap.yaml
#   - TPC-DS 3TB Iceberg tables registered in an AWS Glue database
#
# Usage (set the variables, then render and submit):
#   export RUN_ID=$(date -u +%Y%m%d%H%M)
#   export DATA_BUCKET=<bucket with TPCDS-TEST-3TB-ICEBERG/>
#   export LOGS_BUCKET=<bucket for results and Spark event logs>
#   export ICEBERG_DB=<Glue database with the TPC-DS tables>
#   export IMAGE_COMET=<registry>/<image>:<tag>
#   export ITERATIONS=5 EXECUTOR_INSTANCES=23 QUERY_FILTER="" BENCH_ZONE=us-west-2a
#   envsubst < tpcds-benchmark-spark41-comet-iceberg-s3-aal.yaml | kubectl apply -f -
#
# IMAGE_COMET   Comet image (Dockerfile-comet, INCLUDE_COMET=true)
# BENCH_ZONE must match the zone in nodepool-tpcds-benchmark.yaml.
# ============================================================
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpcds-t2-comet-aal-${RUN_ID}
  namespace: spark-team-a
  labels:
    benchmark: tpcds-3tb-iceberg
    benchmark-test: test2-comet-aal
spec:
  type: Scala
  mode: cluster
  image: "${IMAGE_COMET}"
  imagePullPolicy: IfNotPresent
  sparkVersion: "4.1.3"
  mainClass: com.k8s.spark.benchmark.BenchmarkSQL
  mainApplicationFile: "local:///opt/spark/jars/spark-k8s-benchmarks-assembly-1.0.0.jar"
  arguments:
    - "s3a://${DATA_BUCKET}/TPCDS-TEST-3TB-ICEBERG"   # [0] data dir (Iceberg uses the catalog)
    - "s3a://${LOGS_BUCKET}/TPCDS-3TB-ICEBERG-RESULTS/test2-comet-aal/${RUN_ID}"    # [1] results
    - "/opt/tpcds-kit/tools"                                                     # [2] dsdgen dir
    - "iceberg"                                                                   # [3] format
    - "3000"                                                                      # [4] scale factor (GB)
    - "${ITERATIONS}"                                                             # [5] iterations
    - "false"                                                                     # [6] optimizeQueries
    - "${QUERY_FILTER}"                                                           # [7] query filter ("" = all)
    - "true"                                                                      # [8] WARN logging
    - "glue_catalog.${ICEBERG_DB}"                                                # [9] Iceberg database
  restartPolicy:
    type: Never

  driver:
    cores: 5
    memory: "20g"
    memoryOverhead: "6g"
    serviceAccount: spark-team-a
    template:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsUser: 185
        volumes:
          - name: spark-local-dir-1
            hostPath:
              path: "/mnt/k8s-disks/0"
              type: Directory
          - name: spark-log4j2
            configMap:
              name: spark-log4j2-config
        initContainers:
          - name: volume-permission
            image: public.ecr.aws/docker/library/busybox:1.36
            command: ['sh', '-c', 'mkdir -p /data1/s3a; chown -R 185:185 /data1']
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
        tolerations:
          - key: benchmark
            operator: Equal
            value: tpcds
            effect: NoSchedule
        nodeSelector:
          NodeGroupType: TpcdsBenchmark
          karpenter.sh/capacity-type: on-demand
          node.kubernetes.io/instance-type: r8gd.12xlarge
          topology.kubernetes.io/zone: "${BENCH_ZONE}"
        containers:
          - name: spark-kubernetes-driver
            env:
              - name: JAVA_HOME
                value: "/opt/java/openjdk"
              - name: AWS_REGION
                value: "us-west-2"
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
              - name: spark-log4j2
                mountPath: /opt/spark/log4j2-custom

  executor:
    cores: 5
    memory: "20g"
    memoryOverhead: "6g"
    instances: ${EXECUTOR_INSTANCES}
    serviceAccount: spark-team-a
    template:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsUser: 185
        volumes:
          - name: spark-local-dir-1
            hostPath:
              path: "/mnt/k8s-disks/0"
              type: Directory
          - name: spark-log4j2
            configMap:
              name: spark-log4j2-config
        initContainers:
          - name: volume-permission
            image: public.ecr.aws/docker/library/busybox:1.36
            command: ['sh', '-c', 'mkdir -p /data1/s3a; chown -R 185:185 /data1']
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
        tolerations:
          - key: benchmark
            operator: Equal
            value: tpcds
            effect: NoSchedule
        nodeSelector:
          NodeGroupType: TpcdsBenchmark
          karpenter.sh/capacity-type: on-demand
          node.kubernetes.io/instance-type: r8gd.12xlarge
          topology.kubernetes.io/zone: "${BENCH_ZONE}"
        containers:
          - name: spark-kubernetes-executor
            env:
              - name: JAVA_HOME
                value: "/opt/java/openjdk"
              - name: AWS_REGION
                value: "us-west-2"
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
              - name: spark-log4j2
                mountPath: /opt/spark/log4j2-custom

  sparkConf:
    # ── DataFusion Comet 1.2.0 (settings from apache/datafusion-comet PR #7444) ──
    "spark.plugins": "org.apache.spark.CometPlugin"
    "spark.shuffle.manager": "org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager"
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.comet.CometSparkSessionExtensions"
    "spark.comet.exec.enabled": "true"
    "spark.comet.shuffle.enabled": "true"
    "spark.comet.exec.memoryPool.fraction": "0.8"
    "spark.comet.explain.fallback.enabled": "true"
    # Comet's native Iceberg scan reads S3 with its own Rust client and never
    # touches S3FileIO, so AAL would have no effect. Turn it off so Iceberg's
    # JVM reader (S3FileIO + AAL) feeds Comet's native operators and shuffle.
    "spark.comet.scan.icebergNative.enabled": "false"
    "spark.memory.offHeap.enabled": "true"
    "spark.memory.offHeap.size": "32g"

    # ── Iceberg 1.11.0 + Glue catalog (S3FileIO) ─────────────────────────────
    "spark.sql.catalog.glue_catalog": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.glue_catalog.catalog-impl": "org.apache.iceberg.aws.glue.GlueCatalog"
    "spark.sql.catalog.glue_catalog.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    "spark.sql.catalog.glue_catalog.warehouse": "s3a://${DATA_BUCKET}/TPCDS-TEST-3TB-ICEBERG"
    "spark.sql.catalog.glue_catalog.client.region": "us-west-2"
    # S3 Analytics Accelerator ON (AAL 1.3.1 ships inside iceberg-aws-bundle 1.11.0)
    "spark.sql.catalog.glue_catalog.s3.analytics-accelerator.enabled": "true"

    # ── AQE ──────────────────────────────────────────────────────────────────
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"

    # ── S3A (event logs + results only; Iceberg data uses S3FileIO) ─────────
    "spark.hadoop.fs.s3a.endpoint.region": "us-west-2"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider"
    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    "spark.hadoop.fs.s3a.buffer.dir": "/data1/s3a"
    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"

    # ── Event logs ───────────────────────────────────────────────────────────
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://${LOGS_BUCKET}/spark-event-logs"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "64m"

    # ── Prometheus metrics ───────────────────────────────────────────────────
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    # ── Stability ────────────────────────────────────────────────────────────
    "spark.network.timeout": "2000s"
    "spark.scheduler.minRegisteredResourcesRatio": "1.0"
    "spark.scheduler.maxRegisteredResourcesWaitingTime": "900s"
    "spark.kubernetes.allocation.batch.size": "${EXECUTOR_INSTANCES}"
    "spark.executor.heartbeatInterval": "300s"
    "spark.kubernetes.submission.connectionTimeout": "120000"
    "spark.kubernetes.submission.requestTimeout": "120000"
    "spark.kubernetes.driver.connectionTimeout": "120000"
    "spark.kubernetes.driver.requestTimeout": "120000"
    "spark.kubernetes.executor.podNamePrefix": "tpcds-t2-comet-aal-${RUN_ID}"

    # ── Shuffle / GC / logging ───────────────────────────────────────────────
    "spark.shuffle.file.buffer": "1m"
    "spark.reducer.maxSizeInFlight": "48m"
    "spark.driver.extraJavaOptions": "-Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
    "spark.executor.defaultJavaOptions": "-verbose:gc -XX:+UseParallelGC -Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
