# Prerequisites:
# 1. An S3 bucket for the data.
# 2. In eks.tf, set min_size=6 and desired_size=6 for the managed node group "spark_benchmark_ebs". Then run `terraform apply`.
# 3. The "spark-team-a" namespace.
# 4. Replace `<S3_BUCKET>` with your bucket name.
# 5. The log4j2 ConfigMap: kubectl apply -f data-stacks/spark-on-eks/spark-log4j2-configmap.yaml -n <namespace>
# Then run `kubectl apply -f <filename>`.

# To repeat the test on a different instance type, change the job name to match it.
# Example: tpcds-benchmark-1tb-ebs-r6g

---
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpcds-benchmark-1tb-ebs
  namespace: spark-team-a
spec:
  # YuniKorn is off until the YuniKorn issue is fixed. Spark uses the default Kubernetes scheduler.
  # batchScheduler: yunikorn
  # batchSchedulerOptions:
  #   queue: root.default
  type: Scala
  mode: cluster
  image: public.ecr.aws/data-on-eks/spark3.5.3-scala2.12-java17-python3-ubuntu-tpcds:v2
  imagePullPolicy: IfNotPresent
  sparkVersion: 3.5.3
  mainClass: com.amazonaws.eks.tpcds.BenchmarkSQL
  mainApplicationFile: local:///opt/spark/examples/jars/eks-spark-benchmark-assembly-1.0.jar
  arguments:
    # arg[0] TPC-DS data location
    - "s3a://<S3_BUCKET>/TPCDS-TEST-1TB"
    # arg[1] Results location
    - "s3a://<S3_BUCKET>/TPCDS-TEST-1T-RESULT"
    # arg[2] Path to the TPC-DS kit in the image
    - "/opt/tpcds-kit/tools"
    # arg[3] Data format
    - "parquet"
    # arg[4] Scale factor in GB
    - "1000"
    # arg[5] Iterations
    - "1"
    # arg[6] optimizeQueries
    - "false"
    # arg[7] Query filter, for example "q98-v2.4,q99-v2.4". An empty value runs all queries.
    - ""
    # arg[8] Set the log level to WARN
    - "true"
  sparkConf:
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://<S3_BUCKET>/spark-event-logs"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "64m"

    "spark.network.timeout": "2000s"
    "spark.executor.heartbeatInterval": "300s"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    "spark.kubernetes.executor.podNamePrefix": "benchmark-exec-ebs"
    # "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider" # This is using AWS SDK V1 in maintenance mode
    "spark.hadoop.fs.s3a.aws.credentials.provider.mapping": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider=software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider"  # AWS SDK v2: https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/aws_sdk_upgrade.html
    "spark.hadoop.fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    "spark.hadoop.fs.s3a.buffer.dir": "/tmp/s3a"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.multipart.threshold": "256M"
    "spark.hadoop.fs.s3a.threads.max": "50"
    "spark.hadoop.fs.s3a.connection.maximum": "200"

    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"
    "spark.executor.defaultJavaOptions": "-verbose:gc -XX:+UseParallelGC -XX:InitiatingHeapOccupancyPercent=70"
    # "spark.hadoop.fs.s3a.readahead.range": "256K"

    # Longer Kubernetes client timeouts prevent this driver error:
    #   KubernetesClientException ... Caused by: java.net.SocketTimeoutException: timeout
    # spark.kubernetes.local.dirs.tmpfs: "true" # More details here https://spark.apache.org/docs/latest/running-on-kubernetes.html#using-ram-for-local-storage
    spark.kubernetes.submission.connectionTimeout: "120000" # milliseconds
    spark.kubernetes.submission.requestTimeout: "120000"
    spark.kubernetes.driver.connectionTimeout: "120000"
    spark.kubernetes.driver.requestTimeout: "120000"
    # spark.kubernetes.allocation.batch.size: "20" # default 5 but adjust according to your cluster size
    "spark.hadoop.fs.s3a.multipart.size": "67108864"
    "spark.hadoop.fs.s3a.threads.max": "40"
    "spark.hadoop.fs.s3a.connection.maximum": "100"

    "spark.shuffle.file.buffer": "1m"
    "spark.reducer.maxSizeInFlight": "48m"

    "spark.hadoop.fs.s3a.multipart.purge": "true"
    "spark.hadoop.fs.s3a.multipart.threshold": "134217728"
  volumes:
    - name: spark-log4j2
      configMap:
        name: spark-log4j2-config
  driver:
    cores: 5
    memory: "20g"
    memoryOverhead: "6g"
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    env:
      - name: JAVA_HOME
        value: "/opt/java/openjdk"
    nodeSelector:
      NodeGroupType: spark_benchmark_ebs
    volumeMounts:
      - name: spark-log4j2
        mountPath: /opt/spark/log4j2-custom
  executor:
    cores: 5
    memory: "20g"
    memoryOverhead: "6g"
    instances: 36 # 6 pods on each of the 6 nodes in the EKS managed node group
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    env:
      - name: JAVA_HOME
        value: "/opt/java/openjdk"
    nodeSelector:
      NodeGroupType: spark_benchmark_ebs
    volumeMounts:
      - name: spark-log4j2
        mountPath: /opt/spark/log4j2-custom
  restartPolicy:
    type: Never
