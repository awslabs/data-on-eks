# ============================================================
# Spark Operator scale test: TPC-DS v4, scale factor 30 (30 GB), Parquet in S3.
# Based on spark-app-without-webhook.yaml. The Spark Operator webhook is disabled, so all
# pod settings are in spec.driver.template and spec.executor.template.
#
# S3 layout (cNN = c01 to c50, to spread the S3 request load over 50 prefixes):
#   Source  : s3a://spark-scaletest-eks-tpcds-us-west-2/cNN/tpcds/sf30/
#   Results : s3a://spark-on-eks-spark-logs-344a3629d86dbc9b12395e5b87/cNN/tpcds-results/<app name>/
# This file uses c01. The load test (locustfile.py) will set cNN, the app name, the
# results path, and the namespace for each SparkApplication.
#
# Prerequisites in the job namespace:
#   - ConfigMap spark-log4j2-config (../../spark-log4j2-configmap.yaml)
#   - Service account with the spark_jobs IAM policy (spark-team-a/b/c)
#
# Single run:
#   kubectl apply -f tpcds-sf30-template.yaml
#   kubectl get sparkapplication -n spark-team-a tpcds-sf30 -w
# ============================================================
---
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpcds-sf30
  namespace: spark-team-a

spec:
  type: Scala
  mode: cluster
  image: "public.ecr.aws/data-on-eks/spark-benchmark:tcpds-4-spark-3.5.8-comet-0.15.0-iceberg@sha256:8eb5dcfcc279b65c8a2aa6c0360813fe7774e4f06fe71dd34e0d9c3e3f058830"
  # Pull each image one time per node. "Always" makes a registry call for every pod.
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.8"
  mainClass: com.k8s.spark.benchmark.BenchmarkSQL
  mainApplicationFile: "local:///opt/spark/jars/spark-k8s-benchmarks-assembly-1.0.0.jar"

  arguments:
    # arg[0] tpcdsDataDir - root path of the parquet data in S3
    - "s3a://spark-scaletest-eks-tpcds-us-west-2/c01/tpcds/sf30"
    # arg[1] Results location (one path for each application)
    - "s3a://spark-on-eks-spark-logs-344a3629d86dbc9b12395e5b87/c01/tpcds-results/tpcds-sf30"
    # arg[2] Path to the TPC-DS kit (dsdgen/dsqgen) in the image
    - "/opt/tpcds-kit/tools"
    # arg[3] Data format
    - "parquet"
    # arg[4] Scale factor in GB
    - "30"
    # arg[5] Iterations
    - "1"
    # arg[6] optimizeQueries
    - "true"
    # arg[7] Query filter
    - "q4-v4.0,q24a-v4.0,q24b-v4.0,q67-v4.0"
    # arg[8] Set log level to WARN
    - "true"

  restartPolicy:
    type: Never

  driver:
    cores: 1
    coreLimit: "1"
    memory: "4g"
    memoryOverhead: "1g"
    serviceAccount: spark-team-a
    template:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsUser: 185
          fsGroup: 185
        volumes:
          # Spark uses volumes named "spark-local-dir-*" as local dirs (shuffle, spill).
          # emptyDir is on the node root volume (on NVMe with instanceStorePolicy RAID0).
          # fsGroup gives UID 185 write access, so no busybox init container is necessary.
          - name: spark-local-dir-1
            emptyDir: {}
          - name: spark-log4j2
            configMap:
              name: spark-log4j2-config
        # Existing NodePool memory-optimized-graviton (arm64). The pod narrows it to
        # on-demand r8g/r8gd 8xlarge (32 vCPU, 256 GiB: about 30 pods of 1 vCPU / 5 GiB).
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/nodepool
                      operator: In
                      values: ["memory-optimized-graviton"]
                    - key: karpenter.sh/capacity-type
                      operator: In
                      values: ["on-demand"]
                    - key: node.kubernetes.io/instance-type
                      operator: In
                      values: ["r8g.8xlarge", "r8gd.8xlarge"]
        containers:
          - name: spark-kubernetes-driver
            env:
              - name: JAVA_HOME
                value: "/opt/java/openjdk"
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
              - name: spark-log4j2
                mountPath: /opt/spark/log4j2-custom

  executor:
    instances: 30
    cores: 1
    coreLimit: "1"
    memory: "4g"
    memoryOverhead: "1g"
    serviceAccount: spark-team-a
    template:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsUser: 185
          fsGroup: 185
        volumes:
          - name: spark-local-dir-1
            emptyDir: {}
          - name: spark-log4j2
            configMap:
              name: spark-log4j2-config
        # Same node constraints as the driver.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/nodepool
                      operator: In
                      values: ["memory-optimized-graviton"]
                    - key: karpenter.sh/capacity-type
                      operator: In
                      values: ["on-demand"]
                    - key: node.kubernetes.io/instance-type
                      operator: In
                      values: ["r8g.8xlarge", "r8gd.8xlarge"]
        containers:
          - name: spark-kubernetes-executor
            env:
              - name: JAVA_HOME
                value: "/opt/java/openjdk"
            volumeMounts:
              - name: spark-local-dir-1
                mountPath: /data1
              - name: spark-log4j2
                mountPath: /opt/spark/log4j2-custom

  sparkConf:
    # ── Event logs: off for the scale test ──────────────────────────────────
    "spark.eventLog.enabled": "false"

    # ── Parallelism: 30 executors x 1 core = 30 task slots ─────────────────
    "spark.sql.shuffle.partitions": "120"
    "spark.default.parallelism": "60"

    # ── AQE (Adaptive Query Execution) ──────────────────────────────────────
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"

    # ── S3A / AWS SDK v2 (EKS Pod Identity) ─────────────────────────────────
    "spark.hadoop.fs.s3a.endpoint.region": "us-west-2"
    "spark.hadoop.fs.s3a.aws.credentials.provider.mapping": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider=software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider"
    "spark.hadoop.fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    "spark.hadoop.fs.s3a.buffer.dir": "/data1/s3a"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.multipart.threshold": "256M"
    # 1-core executors: fewer threads and connections for each JVM. At ~300,000 executors,
    # the base values (50 threads, 200 connections) give too many S3 connections.
    "spark.hadoop.fs.s3a.threads.max": "16"
    "spark.hadoop.fs.s3a.connection.maximum": "32"
    # purge=true deletes pending multipart uploads at start. With many jobs that write to the
    # same bucket at the same time, it can delete uploads of other running jobs.
    "spark.hadoop.fs.s3a.multipart.purge": "false"
    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"

    # ── Prometheus metrics ───────────────────────────────────────────────────
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    # ── Stability ────────────────────────────────────────────────────────────
    "spark.network.timeout": "2000s"
    "spark.executor.heartbeatInterval": "300s"
    "spark.kubernetes.submission.connectionTimeout": "120000"
    "spark.kubernetes.submission.requestTimeout": "120000"
    "spark.kubernetes.driver.connectionTimeout": "120000"
    "spark.kubernetes.driver.requestTimeout": "120000"
    "spark.kubernetes.executor.podNamePrefix": "tpcds-sf30"
    # Request executors in batches, to limit the pod create rate on the API server.
    "spark.kubernetes.allocation.batch.size": "10"

    # ── Shuffle tuning ───────────────────────────────────────────────────────
    "spark.shuffle.file.buffer": "1m"
    "spark.reducer.maxSizeInFlight": "48m"

    # ── GC / logging ─────────────────────────────────────────────────────────
    "spark.driver.extraJavaOptions": "-Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
    "spark.executor.defaultJavaOptions": "-verbose:gc -XX:+UseParallelGC -Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
