# agw-demo: GPU nodes. Same settings as the stack's `gpu` NodeClass
# (SOCI parallel pull, RAID0 instance store, fast gp3) plus demo tags.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: agw-demo-gpu
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "${KARPENTER_NODE_IAM_ROLE_NAME}"
  subnetSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-private-secondary*"
  securityGroupSelectorTerms:
    - tags:
        Name: "${CLUSTER_NAME}-node"
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 3000
        throughput: 600
        encrypted: true
        deleteOnTermination: true
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      featureGates:
        FastImagePull: true
      kubelet:
        config:
          serializeImagePulls: false
          maxParallelImagePulls: 5
          registryPullQPS: 50
          registryBurst: 100

    --//--
  tags:
    project: agw-demo
    owner: vara
    Name: agw-demo-gpu
