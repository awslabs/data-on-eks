apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: agw-demo-gpu-gemma
spec:
  template:
    metadata:
      labels:
        agw-demo/pool: gpu-gemma
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: agw-demo-gpu
      # Only nvidia.com/gpu is NoSchedule: the GPU Operator DaemonSets tolerate
      # just that key, so any other NoSchedule taint would hide the GPU.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
        - key: agw-demo
          value: "true"
          effect: PreferNoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # g7.2xlarge: RTX PRO 4500 32 GB (spot score 9). g7e.2xlarge: RTX PRO
        # 6000 96 GB, allowed for spot diversity. Engine config fits 32 GB.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g7.2xlarge", "g7e.2xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ${GPU_ZONES}
  # N+1: 2 serving nodes + 1 replacement. With exactly 2, a drained or
  # drifting node still counts against the limit and Karpenter cannot launch
  # its replacement (seen in the AZ drill: "exceed limits for nodepool").
  limits:
    cpu: "24"
    nvidia.com/gpu: "3"
  # Never consolidate a GPU node that is serving; reclaim only when empty.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
