# =============================================================================
# RayService: Gemma 4 12B (multimodal) on vLLM / Ray 2.57
# =============================================================================
# OpenAI-compatible endpoint via ray.serve.llm. ~22.3 GiB bf16 weights on a
# single L40S 48GB, weights pulled from a same-region S3 mirror.
#
# Requires Ray 2.57.x / vLLM 0.25+ - older ray-llm images (e.g. the DeepSeek
# example's 2.56.0) predate gemma4_unified. `deploy.sh verify` checks this.
#
# Engine config follows https://github.com/vllm-project/recipes/blob/main/Google/Gemma4.md
# Measured cold-start and latency numbers: see README.md.
#
# Placeholders substituted by deploy.sh:
#   $S3_BUCKET  $MODEL_ID  $MODEL_DIR  $AWS_REGION  $ECR_REGISTRY  $RAY_LLM_TAG
# =============================================================================
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: $SERVICE_NAME
  namespace: raydata
  labels:
    benchmark.data-on-eks/scenario: $SCENARIO_ID
spec:
  serveConfigV2: |
    applications:
      - name: llm-app
        import_path: ray.serve.llm:build_openai_app
        route_prefix: "/"
        args:
          llm_configs:
            - model_loading_config:
                model_id: $MODEL_ID
                model_source: s3://$S3_BUCKET/models/$MODEL_DIR
              accelerator_type: $ACCELERATOR_TYPE
              engine_kwargs:
                # DO NOT set load_format: runai_streamer - crashes on Ray 2.57
                # (ray-project/ray#64978).
                dtype: bfloat16
                # Model supports 262144. 64K covers long prompts plus
                # multimodal inputs and still leaves generation headroom;
                # max_model_len bounds input + output combined.
                max_model_len: 65536
                gpu_memory_utilization: 0.90
                enable_prefix_caching: true
                enable_chunked_prefill: true
                async_scheduling: $ASYNC_SCHEDULING
                max_num_seqs: 256
$ENGINE_KWARGS_EXTRA
                # Set both to 0 for text-only serving (skips MM profiling).
                limit_mm_per_prompt:
                  image: 2
                  audio: 1
              runtime_env:
                # Image ships transformers 5.8.0, which predates gemma4_unified
                # config support; vLLM defers config parsing to transformers.
                pip:
                  # Do not use an open-ended lower bound. Transformers 5.15
                  # makes heterogeneous Gemma 4 head_dim strictly per-layer,
                  # while the vLLM build in this Ray 2.57 image still reads the
                  # global attribute and fails engine-config construction.
                  - "transformers==5.10.4"
                env_vars:
                  AWS_REGION: "$AWS_REGION"
                  AWS_DEFAULT_REGION: "$AWS_REGION"
              deployment_config:
                # One replica: a second adds capacity, not speed. Raise
                # max_replicas for throughput serving.
                autoscaling_config:
                  min_replicas: 1
                  max_replicas: 1
                  target_ongoing_requests: 32
                max_ongoing_requests: 128
  rayClusterConfig:
    rayVersion: "2.57.0"
    # Off: with it on, a lost worker makes KubeRay recreate the pod *and* the
    # autoscaler request another, so Karpenter launches two GPU nodes for one.
    enableInTreeAutoscaling: false
    headGroupSpec:
      rayStartParams:
        # Head is pure control plane - no tasks/actors schedule here.
        num-cpus: "0"
      template:
        metadata:
          labels:
                app: $SERVICE_NAME
          annotations:
            # Losing the head takes down the whole Serve app.
            karpenter.sh/do-not-disrupt: "true"
        spec:
          serviceAccountName: raydata
          containers:
            - name: ray-head
              image: $ECR_REGISTRY/ray-llm:$RAY_LLM_TAG
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_REGION
                  value: "$AWS_REGION"
              resources:
                requests:
                  # The memory-optimized x86 EC2NodeClass reserves 2 vCPU.
                  # A 2-CPU request plus DaemonSets cannot fit r6a.xlarge's
                  # remaining 2 allocatable CPUs and causes Karpenter churn.
                  # The head advertises num-cpus=0 and measured ~150m while
                  # serving, so 1 CPU is sufficient for control-plane duties.
                  cpu: "1"
                  memory: 8Gi
                limits:
                  memory: 12Gi
              ports:
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
          nodeSelector:
            kubernetes.io/arch: amd64
            karpenter.sh/nodepool: memory-optimized-x86
            node.kubernetes.io/instance-type: r6a.2xlarge
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          metadata:
            labels:
                app: $SERVICE_NAME
            annotations:
              karpenter.sh/do-not-disrupt: "true"
          spec:
            serviceAccountName: raydata
            containers:
              - name: ray-worker
                image: $ECR_REGISTRY/ray-llm:$RAY_LLM_TAG
                imagePullPolicy: IfNotPresent
                env:
                  - name: AWS_REGION
                    value: "$AWS_REGION"
                resources:
                  requests:
                    cpu: "$WORKER_CPU"
                    memory: $WORKER_MEMORY_REQUEST
                    # Weights land on node NVMe before vLLM loads them.
                    ephemeral-storage: 40Gi
                    nvidia.com/gpu: "$GPU_COUNT"
                  limits:
                    memory: $WORKER_MEMORY_LIMIT
                    nvidia.com/gpu: "$GPU_COUNT"
            nodeSelector:
              karpenter.sh/nodepool: $NODEPOOL_NAME
              karpenter.sh/capacity-type: $CAPACITY_TYPE
              # Every benchmark scenario selects one exact EC2 shape so
              # Karpenter provisions the intended hardware just in time.
              node.kubernetes.io/instance-type: $INSTANCE_TYPE
