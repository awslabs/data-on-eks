# =============================================================================
# RayService: Gemma 4 12B on vLLM / Ray 2.57
# =============================================================================
# Serves an OpenAI-compatible endpoint using ray.serve.llm (build_openai_app).
#
# Gemma 4 12B (google/gemma-4-12B) is the encoder-free unified variant
# (Gemma4UnifiedForConditionalGeneration): ~22.3 GiB bf16 weights that fit a
# single L40S 48GB GPU with room for a large KV cache. This config is tuned for
# high-throughput TEXT generation (image + audio inputs disabled to reclaim the
# multimodal activation budget for KV cache).
#
# IMPORTANT - image / vLLM version:
#   Gemma 4 (model_type gemma4_unified) is only supported by very recent vLLM.
#   The DeepSeek example's ray-llm:2.56.0 image is TOO OLD. This uses a newer
#   ray-llm build ($RAY_LLM_TAG, default a 2.57.x image) mirrored to ECR by
#   deploy.sh. deploy.sh verifies the architecture is registered before deploy.
#
# Weight loading: model_source points at our same-region S3 mirror. ray-llm
# downloads the weights from S3 to the node's NVMe at startup (no HuggingFace
# pull, no rate limits), then vLLM loads them locally. See the NOTE on
# engine_kwargs for why we don't use load_format: runai_streamer here.
#
# Engine config otherwise follows the official vLLM Gemma 4 recipe:
#   https://github.com/vllm-project/recipes/blob/main/Google/Gemma4.md
#  - limit_mm_per_prompt {image:0, audio:0}: text-only, skips MM profiling
#  - async_scheduling: overlap scheduling with decode for throughput
#  - enable_prefix_caching + chunked prefill: keep the batching queue full
#  - max_model_len 32768 (Gemma 4 supports up to 131072; cap for KV cache)
#
# Placeholders (substituted by deploy.sh):
#   $S3_BUCKET      - bucket holding model weights under models/
#   $MODEL_ID       - served model id (default gemma-4-12b)
#   $MODEL_DIR      - S3 subdir under models/ (default gemma-4-12b)
#   $AWS_REGION     - AWS region
#   $ECR_REGISTRY   - e.g. 123456789012.dkr.ecr.us-west-2.amazonaws.com
#   $RAY_LLM_TAG    - e.g. 2.57.0.6c4022-py312-cu130
# =============================================================================
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: gemma4-12b
  namespace: raydata
spec:
  serveConfigV2: |
    applications:
      - name: llm-app
        import_path: ray.serve.llm:build_openai_app
        route_prefix: "/"
        args:
          llm_configs:
            - model_loading_config:
                model_id: $MODEL_ID
                model_source: s3://$S3_BUCKET/models/$MODEL_DIR
              accelerator_type: L40S
              engine_kwargs:
                # NOTE: we deliberately do NOT set load_format: runai_streamer.
                # ray.serve.llm 2.57 has an upstream regression (ray-project/ray
                # issue #64978, fix PR #64996 unmerged): streaming load formats
                # set worker_node_download_model=NONE but never repoint vLLM's
                # `model` at the S3 URI - vLLM then tries to resolve the short
                # model_id on HuggingFace and crashes. Ray 2.56.x streams
                # correctly but its vLLM 0.22 predates gemma4_unified, so 2.57
                # is required for this model. With the default loader, ray-llm
                # downloads the weights from our same-region S3 mirror
                # (model_source below) to the node's NVMe (boto3 parallel
                # download), then vLLM loads them locally. No HuggingFace pull;
                # clean served model_id. Revisit runai_streamer once #64996
                # ships in a ray-llm release.
                dtype: bfloat16
                # Gemma 4 supports up to 131072; 32K keeps a generous KV cache
                # on a single 48GB card while covering typical prompts.
                max_model_len: 32768
                gpu_memory_utilization: 0.90
                enable_prefix_caching: true
                enable_chunked_prefill: true
                async_scheduling: true
                max_num_seqs: 256
                # Multimodal enabled: up to 2 images + 1 audio clip per
                # prompt, so the README's image/audio demos work out of the
                # box. The multimodal encoder budget comes out of the same
                # gpu_memory_utilization pool, shrinking the KV cache vs a
                # text-only config. For max batch-text throughput set both
                # to 0 (skips MM profiling entirely; see recipe).
                limit_mm_per_prompt:
                  image: 2
                  audio: 1
              runtime_env:
                # ray-llm:2.57.0 ships transformers 5.8.0, which predates
                # gemma4_unified config support (Gemma 4 released 2026-07-15).
                # vLLM 0.25.1 has the model code but defers config parsing to
                # transformers, so we upgrade it here (vLLM only pins >=5.5.3).
                # Verified: resolves to 5.14.1 and installs in ~8s on the node.
                pip:
                  - "transformers>=5.10.4"
                # S3 mirror download uses the node's Pod Identity creds; just
                # make sure the region is set for the AWS SDK.
                env_vars:
                  AWS_REGION: "$AWS_REGION"
                  AWS_DEFAULT_REGION: "$AWS_REGION"
              deployment_config:
                autoscaling_config:
                  min_replicas: 1
                  max_replicas: 2
                  target_ongoing_requests: 32
                max_ongoing_requests: 128
  rayClusterConfig:
    rayVersion: "2.57.0"
    enableInTreeAutoscaling: true
    autoscalerOptions:
      version: v2
      idleTimeoutSeconds: 300
    headGroupSpec:
      rayStartParams:
        # Keep the head as pure control plane: no tasks/actors schedule here.
        num-cpus: "0"
      template:
        metadata:
          labels:
            app: gemma4-12b
          annotations:
            # Protect the head from Karpenter consolidation evictions too -
            # losing the head takes down the whole Serve app.
            karpenter.sh/do-not-disrupt: "true"
        spec:
          serviceAccountName: raydata
          containers:
            - name: ray-head
              image: $ECR_REGISTRY/ray-llm:$RAY_LLM_TAG
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_REGION
                  value: "$AWS_REGION"
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  memory: 12Gi
              ports:
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
          nodeSelector:
            kubernetes.io/arch: amd64
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
        rayStartParams: {}
        template:
          metadata:
            labels:
              app: gemma4-12b
            annotations:
              # Karpenter consolidation will otherwise evict this pod as
              # "Underutilized" (GPU requests don't count toward its cpu/mem
              # utilization math) and kill the live engine minutes after it
              # becomes Ready. Observed in testing.
              karpenter.sh/do-not-disrupt: "true"
          spec:
            serviceAccountName: raydata
            containers:
              - name: ray-worker
                image: $ECR_REGISTRY/ray-llm:$RAY_LLM_TAG
                imagePullPolicy: IfNotPresent
                env:
                  - name: AWS_REGION
                    value: "$AWS_REGION"
                resources:
                  requests:
                    cpu: "6"
                    memory: 48Gi
                    # ~22.3 GiB weights download to the node's NVMe (RAID0
                    # instance store) before vLLM loads them locally.
                    ephemeral-storage: 40Gi
                    nvidia.com/gpu: "1"
                  limits:
                    memory: 56Gi
                    nvidia.com/gpu: "1"
            nodeSelector:
              karpenter.sh/nodepool: gpu
            # Prefer g6e.2xlarge but allow g6e.4xlarge as fallback (same
            # single L40S 48GB GPU) - g6e.2xlarge frequently has capacity
            # shortages (ICE) in us-west-2.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node.kubernetes.io/instance-type
                          operator: In
                          values:
                            - g6e.2xlarge
                            - g6e.4xlarge
